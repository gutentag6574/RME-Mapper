[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rme-mapper"
version = "0.12.0"
description = "GeoPoint Mapper — универсальное настольное ГИС-приложение для работы с картами, координатами и геодезическими зонами"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Кульдеев Вадим Алексеевич", email = "zingeevruslan@gmail.com" }
]
dependencies = [
    "PySide6>=6.6.0",
    "pyproj>=3.6.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "numpy>=1.26.0",
    "pyogrio>=0.7.0",
    "rasterio>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
geopoint-mapper = "rme_mapper.main:main"
rme-mapper = "rme_mapper.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=scratch/pytest -p no:cacheprovider"
filterwarnings = [
    "ignore::UserWarning:pyproj.*",
]
