[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rme-mapper"
version = "0.1.0"
description = "Настольное приложение для привязки и нанесения географических координат на карты Республики Марий Эл"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "RME-Mapper Team" }
]
dependencies = [
    "PySide6>=6.6.0",
    "pyproj>=3.6.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
rme-mapper = "rme_mapper.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::UserWarning:pyproj.*",
]
